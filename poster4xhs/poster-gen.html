<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@400;700;900&display=block" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#333; display:flex; justify-content:center; align-items:center; min-height:100vh; }
#qr-target { position:fixed; left:-9999px; top:0; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="qr-target"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
</script>
<script>
(async function() {
  await document.fonts.ready;

  const W = 1080, H = 1920;
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  const bgImg = new Image();
  bgImg.src = '../hero-bg.png';
  await new Promise((resolve, reject) => {
    bgImg.onload = resolve;
    bgImg.onerror = () => reject(new Error('hero-bg.png missing'));
  });
  ctx.drawImage(bgImg, 0, 0, W, H);

  const BLUE   = '#3a6b8c';
  const ORANGE = '#d4794a';
  const GREEN  = '#7a9a6e';

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r); ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
  }

  function ts(text, x, y, font, color, shadowColor, shadowBlur) {
    ctx.font = font;
    ctx.shadowColor = shadowColor; ctx.shadowBlur = shadowBlur;
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 4;
    ctx.fillStyle = color; ctx.fillText(text, x, y);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  }

  // Vignettes
  const tv = ctx.createLinearGradient(0,0,0,550);
  tv.addColorStop(0,'rgba(0,0,0,0.32)'); tv.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tv; ctx.fillRect(0,0,W,550);

  const mb = ctx.createLinearGradient(0,160,0,900);
  mb.addColorStop(0,'rgba(0,0,0,0.08)'); mb.addColorStop(0.2,'rgba(0,0,0,0.32)');
  mb.addColorStop(0.55,'rgba(0,0,0,0.1)'); mb.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mb; ctx.fillRect(0,160,W,740);

  const bv = ctx.createLinearGradient(0,1200,0,H);
  bv.addColorStop(0,'rgba(0,0,0,0)'); bv.addColorStop(0.2,'rgba(0,0,0,0.22)');
  bv.addColorStop(0.5,'rgba(0,0,0,0.42)'); bv.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle=bv; ctx.fillRect(0,1200,W,H-1200);

  ctx.textAlign='center'; ctx.textBaseline='top';

  // Slogan
  ts('不因少了一座雪峰', W/2, 220, '900 130px "Noto Serif SC","STXingkai","SimHei","Microsoft YaHei",serif', '#ffffff', 'rgba(0,0,0,0.62)', 20);
  ts('而影响你的志愿填报', W/2, 400, '700 86px "Noto Serif SC","STKaiti","KaiTi","SimSun",serif', '#ffe8c0', 'rgba(0,0,0,0.55)', 14);

  const sw = ctx.measureText('不因少了一座雪峰').width;
  const lw = sw*0.42, lx = (W-lw)/2;
  ctx.strokeStyle='rgba(212,121,74,0.5)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(lx,525); ctx.lineTo(lx+lw,525); ctx.stroke();
  ctx.fillStyle='rgba(212,121,74,0.6)';
  ctx.beginPath(); ctx.moveTo(W/2,516); ctx.lineTo(W/2+9,525); ctx.lineTo(W/2,534); ctx.lineTo(W/2-9,525); ctx.closePath(); ctx.fill();

  // Value prop
  ts('方向，比努力更重要', W/2, 590, '900 56px "Microsoft YaHei","Noto Serif SC","PingFang SC",sans-serif', '#ffffff', 'rgba(0,0,0,0.5)', 12);
  ctx.font='400 28px "Microsoft YaHei","Noto Serif SC",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.78)'; ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=6;
  ctx.fillText('找到真正适合你的理工科专业', W/2, 665);
  ctx.shadowColor='transparent'; ctx.shadowBlur=0;

  // Three pillars
  const pillars = [
    { color:ORANGE, draw(x,y){
      ctx.fillStyle=ORANGE; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.moveTo(x,y-40); ctx.lineTo(x+38,y+18); ctx.lineTo(x-38,y+18); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffe8c0';
      ctx.beginPath(); ctx.moveTo(x,y-33); ctx.lineTo(x+18,y-2); ctx.lineTo(x-18,y-2); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }, lines:['别让盲目选择','辜负十二年寒窗'] },
    { color:BLUE, draw(x,y){
      ctx.strokeStyle=BLUE; ctx.lineWidth=3.2; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(x,y,35,0,Math.PI*2); ctx.stroke();
      ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.stroke();
      ctx.lineWidth=2.8; ctx.beginPath(); ctx.moveTo(x,y-22); ctx.lineTo(x,y+22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-22,y); ctx.lineTo(x+22,y); ctx.stroke();
      ctx.fillStyle=BLUE; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=ORANGE; ctx.beginPath(); ctx.moveTo(x,y-25); ctx.lineTo(x+7,y-16); ctx.lineTo(x-7,y-16); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }, lines:['了解思维偏好','才能选对赛道'] },
    { color:GREEN, draw(x,y){
      ctx.fillStyle=GREEN; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.moveTo(x,y-38); ctx.lineTo(x+16,y-6); ctx.lineTo(x+38,y); ctx.lineTo(x+16,y+6);
      ctx.lineTo(x,y+38); ctx.lineTo(x-16,y+6); ctx.lineTo(x-38,y); ctx.lineTo(x-16,y-6); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#b8d4a8';
      ctx.beginPath(); ctx.moveTo(x,y-22); ctx.lineTo(x+9,y-3); ctx.lineTo(x+22,y); ctx.lineTo(x+9,y+3);
      ctx.lineTo(x,y+22); ctx.lineTo(x-9,y+3); ctx.lineTo(x-22,y); ctx.lineTo(x-9,y-3); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }, lines:['2 分钟','找到专业方向'] },
  ];

  const pY=810, cW=W/3;
  pillars.forEach((p,i)=>{
    const cx=cW/2+i*cW;
    p.draw(cx,pY);
    ctx.font='700 28px "Microsoft YaHei","Noto Serif SC",sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.shadowColor='rgba(0,0,0,0.38)'; ctx.shadowBlur=6;
    p.lines.forEach((l,li)=>{ ctx.fillText(l,cx,pY+66+li*38); });
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
  });

  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(200,pY+170); ctx.lineTo(W-200,pY+170); ctx.stroke();

  // Brand
  const bY=1420;
  ts('ExploreMyWay', W/2, bY, '900 54px "Microsoft YaHei","Noto Serif SC",sans-serif', '#ffe8c0', 'rgba(0,0,0,0.5)', 12);
  ctx.font='400 22px "Microsoft YaHei","Noto Serif SC",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('高考理工科专业倾向测试', W/2, bY+68);

  // QR
  const qs=150, qX=W/2-qs/2, qY=bY+120;
  roundRect(qX-34,qY-26,qs+68,qs+155,32);
  ctx.fillStyle='rgba(10,18,30,0.55)'; ctx.fill();
  ctx.strokeStyle='rgba(212,121,74,0.22)'; ctx.lineWidth=1; ctx.stroke();
  ctx.font='700 20px "Microsoft YaHei","Noto Serif SC",sans-serif';
  ctx.fillStyle='rgba(232,192,96,0.95)'; ctx.fillText('扫码发现你的专业方向', W/2, qY+qs+105);

  // Generate QR
  const qrDiv=document.getElementById('qr-target');
  qrDiv.innerHTML='';
  new QRCode(qrDiv,{
    text:'https://xycease.github.io/exploremyway/',
    width:qs, height:qs,
    colorDark:'#ffffff', colorLight:'#1e293b',
    correctLevel:QRCode.CorrectLevel.M
  });
  await new Promise(r=>setTimeout(r,800));
  const qi=qrDiv.querySelector('img');
  if(qi) ctx.drawImage(qi, qX, qY, qs, qs);

  // Noise
  const id=ctx.getImageData(0,0,W,H), d=id.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*3; d[i]=Math.min(255,Math.max(0,d[i]+n)); d[i+1]=Math.min(255,Math.max(0,d[i+1]+n)); d[i+2]=Math.min(255,Math.max(0,d[i+2]+n)); }
  ctx.putImageData(id,0,0);
  console.log('Done');
})();
</script>
</body>
</html>
